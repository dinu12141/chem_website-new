version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smartchem-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: smartchem
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - smartchem-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartchem-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=smartchem
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - SECRET_KEY=smartchem_secret_key_2024_nadeeka_warnakula
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - smartchem-network
    volumes:
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartchem-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - REACT_APP_API_URL=http://localhost:8000/api
      - GENERATE_SOURCEMAP=false
      - REACT_APP_ENVIRONMENT=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smartchem-network

volumes:
  mongodb_data:
    driver: local

networks:
  smartchem-network:
    driver: bridge